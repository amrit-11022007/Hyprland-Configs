# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        10.5

# Window
remember_window_size    no
initial_window_width    110c
initial_window_height   32c
window_padding_width    12
hide_window_decorations yes
active_border_color     #7fb7a4
inactive_border_color   #343e49

# Background (blur comes from Hyprland, see note)
background_opacity 0.88

# Cursor
cursor_shape          block
cursor_blink_interval 0
cursor                #7fb7a4
cursor_text_color     #1b2027

# Palette: slate + sage + amber
foreground            #cdd6dc
background            #1b2027
selection_foreground  #1b2027
selection_background  #7fb7a4
url_color             #8da9c4

# Normal colours
color0  #2d3540
color1  #d98282
color2  #7fb7a4
color3  #d9a66b
color4  #8da9c4
color5  #a98fb5
color6  #85b8c4
color7  #cdd6dc

# Bright colours
color8  #89939e
color9  #e59a9a
color10 #96c9b6
color11 #e6bb85
color12 #a3bdd6
color13 #bea6c9
color14 #9ccdd8
color15 #e8eef1

# Tabs
tab_bar_style powerline
active_tab_foreground   #1b2027
active_tab_background   #7fb7a4
inactive_tab_foreground #89939e
inactive_tab_background #242b34

# Miscellaneous
confirm_os_window_close 0
enable_audio_bell no